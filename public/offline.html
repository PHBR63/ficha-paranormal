<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Roll - Offline</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      background: #0a0514;
      font-family: 'Crimson Text', Georgia, serif;
      color: #e8e4e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    
    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1;
    }
    
    /* Grid pattern */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(139, 0, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139, 0, 0, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }
    
    .content {
      position: relative;
      z-index: 10;
      max-width: 500px;
    }
    
    .icon-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      position: relative;
    }
    
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(139, 0, 0, 0.5));
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    
    .glitch-ring {
      position: absolute;
      inset: -10px;
      border: 2px solid rgba(139, 0, 0, 0.3);
      border-radius: 50%;
      animation: glitch 2s linear infinite;
    }
    
    @keyframes glitch {
      0%, 90%, 100% { opacity: 0.3; transform: scale(1); }
      92% { opacity: 0.8; transform: scale(1.1) translateX(2px); }
      94% { opacity: 0.5; transform: scale(1.05) translateX(-2px); }
      96% { opacity: 0.9; transform: scale(1.15); }
      98% { opacity: 0.4; transform: scale(1); }
    }
    
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #8B0000;
      margin-bottom: 1rem;
      text-shadow: 0 0 30px rgba(139, 0, 0, 0.5);
    }
    
    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232, 228, 224, 0.6);
      margin-bottom: 2rem;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: rgba(232, 228, 224, 0.8);
      margin-bottom: 2rem;
    }
    
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, #8B0000 0%, #5c0000 100%);
      border: 1px solid rgba(139, 0, 0, 0.5);
      border-radius: 8px;
      color: #e8e4e0;
      font-family: 'Cinzel', serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(139, 0, 0, 0.3);
    }
    
    .retry-btn:hover {
      background: linear-gradient(135deg, #B22222 0%, #8B0000 100%);
      box-shadow: 0 6px 30px rgba(139, 0, 0, 0.5);
      transform: translateY(-2px);
    }
    
    .retry-btn:active {
      transform: translateY(0);
    }
    
    .retry-icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 3rem;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(232, 228, 224, 0.4);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #8B0000;
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    
    .decorative-line {
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.5), transparent);
      margin: 1.5rem auto;
    }
    
    /* Floating particles */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: rgba(139, 0, 0, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
    
    .particle:nth-child(1) { top: 20%; left: 10%; animation: float 8s ease-in-out infinite; }
    .particle:nth-child(2) { top: 60%; left: 80%; animation: float 10s ease-in-out infinite 1s; }
    .particle:nth-child(3) { top: 80%; left: 20%; animation: float 12s ease-in-out infinite 2s; }
    .particle:nth-child(4) { top: 30%; left: 70%; animation: float 9s ease-in-out infinite 0.5s; }
    .particle:nth-child(5) { top: 70%; left: 50%; animation: float 11s ease-in-out infinite 1.5s; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
      25% { transform: translateY(-20px) translateX(10px); opacity: 0.6; }
      50% { transform: translateY(-10px) translateX(-10px); opacity: 0.4; }
      75% { transform: translateY(-30px) translateX(5px); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  
  <div class="content">
    <div class="icon-container">
      <div class="glitch-ring"></div>
      <img src="/logo.svg" alt="Let's Roll Logo" class="logo-img" />
    </div>
    
    <h1>CONEXÃO PERDIDA</h1>
    <p class="subtitle">Interferência Paranormal Detectada</p>
    
    <div class="decorative-line"></div>
    
    <p>
      A comunicação com a Central da Ordo Realitas foi interrompida. 
      Verifique sua conexão e tente restabelecer o contato.
    </p>
    
    <button class="retry-btn" onclick="window.location.reload()">
      <svg class="retry-icon" viewBox="0 0 24 24">
        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
      Reconectar
    </button>
    
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span>Modo Offline Ativo</span>
    </div>
  </div>
</body>
</html>
