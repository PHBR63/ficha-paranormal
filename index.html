<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Let's Roll" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Apple Touch Icons com fundo sólido para iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />

    <meta property="og:title" content="Let's Roll - VTT Ordem Paranormal" />
    <meta property="og:description" content="Mesa Virtual para Ordem Paranormal RPG v1.3 - Sistema oficial da Ordo Realitas" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@LetsRollVTT" />
    <meta name="twitter:title" content="Let's Roll - VTT Ordem Paranormal" />
    <meta name="twitter:description" content="Mesa Virtual para Ordem Paranormal RPG v1.3" />
    <meta name="twitter:image" content="/logo.png" />
    
    <!-- Google Fonts - Carregamento otimizado com preconnect e display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" 
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback para navegadores sem JS -->
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>

  <body class="dark">
    <div id="root">
      <!-- Splash Screen inicial antes do React montar -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0514;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      ">
        <div class="loader-content" style="
          position: relative;
          width: 80px;
          height: 80px;
          animation: fadeInUp 0.6s ease-out forwards;
        ">
          <!-- Glow effect -->
          <div style="
            position: absolute;
            inset: -20px;
            background: rgba(139, 0, 0, 0.3);
            border-radius: 50%;
            filter: blur(20px);
            animation: pulse 2s ease-in-out infinite, glowExpand 0.8s ease-out forwards;
          "></div>
          <!-- Logo -->
          <img 
            src="/logo.png" 
            alt="Let's Roll" 
            style="
              width: 100%;
              height: 100%;
              object-fit: contain;
              position: relative;
              z-index: 1;
              animation: pulse 2s ease-in-out infinite;
            "
          />
        </div>
        <p style="
          margin-top: 1.5rem;
          font-family: 'Cinzel', serif;
          font-size: 0.75rem;
          letter-spacing: 0.2em;
          color: rgba(139, 0, 0, 0.8);
          text-transform: uppercase;
          animation: fadeInUp 0.6s ease-out 0.2s forwards;
          opacity: 0;
        ">Carregando...</p>
        
        <!-- Barra de progresso sutil -->
        <div style="
          position: absolute;
          bottom: 15%;
          left: 50%;
          transform: translateX(-50%);
          width: 120px;
          height: 2px;
          background: rgba(139, 0, 0, 0.2);
          border-radius: 1px;
          overflow: hidden;
          animation: fadeInUp 0.6s ease-out 0.4s forwards;
          opacity: 0;
        ">
          <div style="
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.8), transparent);
            animation: progressSlide 1.5s ease-in-out infinite;
          "></div>
        </div>
        
        <style>
          @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
          }
          @keyframes fadeInUp {
            from {
              opacity: 0;
              transform: translateY(20px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }
          @keyframes glowExpand {
            from {
              transform: scale(0.5);
              opacity: 0;
            }
            to {
              transform: scale(1);
              opacity: 1;
            }
          }
          @keyframes progressSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
          #initial-loader.fade-out {
            opacity: 0 !important;
            transform: scale(1.05);
            pointer-events: none;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
