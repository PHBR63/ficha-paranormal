<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Let's Roll - VTT Ordem Paranormal</title>
    <meta name="description" content="Mesa Virtual para Ordem Paranormal RPG v1.3 - Sistema oficial da Ordo Realitas" />
    <meta name="author" content="Let's Roll" />
    <meta name="keywords" content="Ordem Paranormal, RPG, VTT, Mesa Virtual, Ordo Realitas, Horror" />
    
    <!-- Theme color para mobile -->
    <meta name="theme-color" content="#0a0514" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Let's Roll" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <meta property="og:title" content="Let's Roll - VTT Ordem Paranormal" />
    <meta property="og:description" content="Mesa Virtual para Ordem Paranormal RPG v1.3 - Sistema oficial da Ordo Realitas" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@LetsRollVTT" />
    <meta name="twitter:title" content="Let's Roll - VTT Ordem Paranormal" />
    <meta name="twitter:description" content="Mesa Virtual para Ordem Paranormal RPG v1.3" />
    <meta name="twitter:image" content="/logo.png" />
    
    <!-- Google Fonts - Carregamento otimizado com preconnect e display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" 
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback para navegadores sem JS -->
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>

  <body class="dark">
    <div id="root">
      <!-- Splash Screen inicial antes do React montar -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0514;
        z-index: 9999;
      ">
        <div style="
          position: relative;
          width: 80px;
          height: 80px;
        ">
          <!-- Glow effect -->
          <div style="
            position: absolute;
            inset: -20px;
            background: rgba(139, 0, 0, 0.3);
            border-radius: 50%;
            filter: blur(20px);
            animation: pulse 2s ease-in-out infinite;
          "></div>
          <!-- Logo -->
          <img 
            src="/logo.png" 
            alt="Let's Roll" 
            style="
              width: 100%;
              height: 100%;
              object-fit: contain;
              position: relative;
              z-index: 1;
              animation: pulse 2s ease-in-out infinite;
            "
          />
        </div>
        <p style="
          margin-top: 1.5rem;
          font-family: 'Cinzel', serif;
          font-size: 0.75rem;
          letter-spacing: 0.2em;
          color: rgba(139, 0, 0, 0.8);
          text-transform: uppercase;
        ">Carregando...</p>
        <style>
          @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
